[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udstyle"
version = "0.2"
description = "Compute complexity metrics from Universal Dependencies"
requires-python = ">=3.9"
dependencies = [
    "langcodes",
    "pandas",
    "wordfreq>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
parse = [
    "stanza",
]

[tool.setuptools]
py-modules = ["udstyle"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--disable-plugin-autoload"]
